name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test and type-check dependencies
        run: python -m pip install --disable-pip-version-check PyYAML mypy types-PyYAML

      - name: Compile Python sources
        run: python -m compileall -q homeassistant_syncapp/app

      - name: Static type check
        run: |
          python -m mypy \
            --python-version 3.13 \
            --ignore-missing-imports \
            homeassistant_syncapp/app

      - name: Run unit tests
        env:
          PYTHONPATH: homeassistant_syncapp/app
        run: python -m unittest discover -s tests -v

      - name: Validate app metadata YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          source_repository = "https://github.com/Togarriapa/HomeAssistant_SyncApp"
          repository = yaml.safe_load(Path("repository.yaml").read_text())
          app = yaml.safe_load(Path("homeassistant_syncapp/config.yaml").read_text())

          assert repository["url"] == source_repository
          assert app["url"] == source_repository
          for key in ("name", "version", "slug", "description", "arch"):
              assert key in app, f"missing required app key: {key}"
          assert set(app["arch"]) == {"aarch64", "amd64"}

          assert "homeassistant_repository_url" in app["options"]
          assert app["options"]["homeassistant_repository_url"] is None
          assert "homeassistant_repository_url" in app["schema"]
          assert "repository_url" not in app["options"], (
              "deprecated repository_url must not be presented as the default target option"
          )
          assert app["options"]["initial_local_publish_enabled"] is False
          assert app["options"]["initial_remote_apply_enabled"] is False
          PY

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build app image
        run: |
          BUILD_VERSION="$(awk -F'"' '/^version:/{print $2; exit}' homeassistant_syncapp/config.yaml)"
          test -n "$BUILD_VERSION"
          docker build \
            --build-arg BUILD_VERSION="$BUILD_VERSION" \
            --build-arg BUILD_ARCH=amd64 \
            --tag homeassistant-syncapp:test \
            homeassistant_syncapp

      - name: Smoke-test bootstrap contract inside built image
        run: |
          docker run --rm \
            --entrypoint /usr/bin/python3 \
            homeassistant-syncapp:test \
            -E -s -B -c '
          import os
          import sys

          sys.path.insert(0, "/app")
          import process_bootstrap

          source = {
              "SUPERVISOR_TOKEN": "smoke-token",
              "TZ": "Europe/Lisbon",
              "LANG": "C.UTF-8",
              "HTTPS_PROXY": "http://untrusted.invalid:8080",
              "GIT_DIR": "/untrusted/git",
              "PYTHONPATH": "/untrusted/python",
              "LD_PRELOAD": "/untrusted/lib.so",
          }
          expected = {
              "PATH": "/usr/bin:/bin",
              "PYTHONNOUSERSITE": "1",
              "SUPERVISOR_TOKEN": "smoke-token",
              "TZ": "Europe/Lisbon",
              "LANG": "C.UTF-8",
          }
          assert process_bootstrap.build_service_environment(source) == expected

          calls = []
          process_bootstrap.os.execve = lambda executable, arguments, environment: calls.append(
              (executable, arguments, environment)
          )
          os.environ.clear()
          os.environ.update(source)
          try:
              process_bootstrap.main()
          except RuntimeError as exc:
              assert str(exc) == "os.execve unexpectedly returned"
          else:
              raise AssertionError("bootstrap unexpectedly returned successfully")

          assert len(calls) == 1
          executable, arguments, environment = calls[0]
          assert executable == "/usr/bin/python3"
          assert arguments == ["/usr/bin/python3", "-E", "-s", "-B", "/app/main.py"]
          assert "smoke-token" not in arguments
          assert environment == expected
          '
