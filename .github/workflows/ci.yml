name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test and type-check dependencies
        run: python -m pip install --disable-pip-version-check PyYAML mypy types-PyYAML

      - name: Compile Python sources
        run: python -m compileall -q homeassistant_syncapp/app

      - name: Static type check
        run: |
          python -m mypy \
            --python-version 3.13 \
            --ignore-missing-imports \
            homeassistant_syncapp/app

      - name: Run unit tests
        env:
          PYTHONPATH: homeassistant_syncapp/app
        run: python -m unittest discover -s tests -v

      - name: Validate app metadata YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          repository = yaml.safe_load(Path("repository.yaml").read_text())
          app = yaml.safe_load(Path("homeassistant_syncapp/config.yaml").read_text())

          assert repository["url"] == "https://github.com/Togarriapa/HomeAssistant_SyncApp"
          for key in ("name", "version", "slug", "description", "arch"):
              assert key in app, f"missing required app key: {key}"
          assert set(app["arch"]) == {"aarch64", "amd64"}
          PY

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build app image
        run: |
          BUILD_VERSION="$(awk -F'"' '/^version:/{print $2; exit}' homeassistant_syncapp/config.yaml)"
          test -n "$BUILD_VERSION"
          docker build \
            --build-arg BUILD_VERSION="$BUILD_VERSION" \
            --build-arg BUILD_ARCH=amd64 \
            --tag homeassistant-syncapp:test \
            homeassistant_syncapp
